<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manual Bosch LE-Jetronic</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111;
    color:white;
}

header{

    background:#202020;
    padding:15px;
    text-align:center;
    font-size:26px;
    font-weight:bold;

}

header span{

    display:block;
    font-size:16px;
    color:#cccccc;
    margin-top:5px;

}

.viewer{

    text-align:center;
    margin-top:20px;

}

.viewer img{

    width:95%;
    max-width:900px;

    border-radius:8px;

    box-shadow:0px 0px 25px rgba(0,0,0,.6);

}

footer{

    margin-top:20px;

    background:#202020;

    padding:15px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:20px;

    flex-wrap:wrap;

}

button{

    background:#0b79d0;

    color:white;

    border:none;

    padding:12px 20px;

    border-radius:6px;

    cursor:pointer;

    font-size:16px;

}

button:hover{

    background:#095d9f;

}

#pagina{

    font-size:18px;

    font-weight:bold;

}

</style>

</head>

<body>

<header>

MIURA FANS

<span>Manual Bosch LE-Jetronic</span>

</header>

<div class="viewer">

<img id="manual" src="001.png">

</div>

<footer>

<button onclick="anterior()">◀ Anterior</button>

<div id="pagina">

Página 1 de 33

</div>

<button onclick="proxima()">Próxima ▶</button>

</footer>

<script>

let pagina=1;

const total=33;

function atualizar(){

let numero=pagina.toString().padStart(3,"0");

document.getElementById("manual").src=numero+".png";

document.getElementById("pagina").innerHTML="Página "+pagina+" de "+total;

}

function proxima(){

if(pagina<total){

pagina++;

atualizar();

}

}

function anterior(){

if(pagina>1){

pagina--;

atualizar();

}

}

</script>

</body>

</html>
