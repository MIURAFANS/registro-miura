<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miura Fans - Manual Bosch LE-Jetronic</title>
<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}
header{
    background:#1d1d1d;
    padding:16px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
}
header h1{
    margin:0;
    font-size:28px;
}
header p{
    margin:6px 0 0;
    color:#ccc;
}
#viewer{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
#viewer img{
    max-width:95%;
    max-height:78vh;
    border-radius:8px;
    box-shadow:0 0 20px rgba(0,0,0,.7);
}
footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#1d1d1d;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    padding:12px;
}
button{
    background:#0b7dda;
    color:#fff;
    border:none;
    border-radius:6px;
    padding:10px 18px;
    cursor:pointer;
    font-size:16px;
}
button:hover{
    background:#095ea5;
}
#status{
    min-width:130px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>
<body>

<header>
<h1>MIURA FANS</h1>
<p>Manual Bosch LE-Jetronic</p>
</header>

<div id="viewer">
<img id="manual" src="001.webp" alt="Página do Manual">
</div>

<footer>
<button onclick="anterior()">◀ Anterior</button>
<div id="status">Página 1 de 33</div>
<button onclick="proxima()">Próxima ▶</button>
</footer>

<script>
let pagina=1;
const total=33;

function carregar(){
    const nome=String(pagina).padStart(3,'0')+'.webp';
    document.getElementById('manual').src=nome;
    document.getElementById('status').textContent='Página '+pagina+' de '+total;
}

function proxima(){
    if(pagina<total){
        pagina++;
        carregar();
    }
}

function anterior(){
    if(pagina>1){
        pagina--;
        carregar();
    }
}

document.addEventListener('keydown',function(e){
    if(e.key==="ArrowRight") proxima();
    if(e.key==="ArrowLeft") anterior();
});

carregar();
</script>

</body>
</html>
