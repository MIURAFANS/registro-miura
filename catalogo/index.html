<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catálogo de Peças Miura</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{

    background:#1c1c1c;
    padding:20px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:999;
}

h1{

    font-size:40px;
    margin-bottom:15px;

}

#pesquisa{

    width:90%;
    max-width:600px;
    padding:12px;
    font-size:18px;
    border-radius:6px;
    border:none;

}

#contador{

    margin-top:15px;
    color:#bbb;
    font-size:15px;

}

#lista{

    width:95%;
    max-width:900px;
    margin:30px auto;

}

.card{

    background:#222;
    margin-bottom:30px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,.5);

}

.card img{

    width:100%;
    display:block;
    cursor:pointer;

}

.info{

    padding:20px;

}

.info h2{

    margin-bottom:15px;
    color:#fff;

}

.info p{

    margin-bottom:10px;
    line-height:1.5em;

}

#modal{

    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:9999;

}

#modal img{

    max-width:95%;
    max-height:95%;

}

</style>

</head>

<body>

<header>

<h1>CATÁLOGO DE PEÇAS MIURA</h1>

<input
id="pesquisa"
type="text"
placeholder="Pesquisar peça..."
>

<div id="contador"></div>

</header>

<div id="lista"></div>

<div id="modal" onclick="fecharImagem()">

<img id="imagemGrande">

</div>

<script>

let pecas=[];

async function carregarCatalogo(){

    try{

        const resposta=await fetch("pecas.json?"+Date.now());

        if(!resposta.ok){

            throw new Error("Não foi possível carregar pecas.json");

        }

        pecas=await resposta.json();

        mostrarPecas(pecas);

    }

    catch(erro){

        console.error(erro);

        document.getElementById("lista").innerHTML=
        "<h2 style='color:red;text-align:center'>Erro ao carregar o catálogo.</h2>";

    }

}

function mostrarPecas(lista){

    const div=document.getElementById("lista");

    div.innerHTML="";

    document.getElementById("contador").innerHTML=
    lista.length+" peça(s) encontrada(s)";

    lista.forEach(function(p){

        div.innerHTML+=`

        <div class="card">

            <img
            src="imagens/${p.imagem}"
            onclick="abrirImagem(this.src)"
            loading="lazy"
            >

            <div class="info">

                <h2>${p.nome}</h2>

                <p><b>Código:</b> ${p.codigo}</p>

                <p><b>Aplicação:</b> ${p.aplicacao}</p>

                <p>${p.descricao}</p>

            </div>

        </div>

        `;

    });

}

document.getElementById("pesquisa").addEventListener("input",function(){

    const texto=this.value.toLowerCase();

    const resultado=pecas.filter(function(p){

        return(

            p.codigo.toLowerCase().includes(texto) ||

            p.nome.toLowerCase().includes(texto) ||

            p.aplicacao.toLowerCase().includes(texto) ||

            p.descricao.toLowerCase().includes(texto)

        );

    });

    mostrarPecas(resultado);

});

function abrirImagem(src){

    document.getElementById("imagemGrande").src=src;

    document.getElementById("modal").style.display="flex";

}

function fecharImagem(){

    document.getElementById("modal").style.display="none";

}

carregarCatalogo();

</script>

</body>
</html>
