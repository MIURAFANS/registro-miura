<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catálogo de Peças Miura</title>

<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    background:#1d1d1d;
    padding:20px;
    text-align:center;
    position:sticky;
    top:0;
}

header h1{
    margin:0;
    font-size:32px;
}

#pesquisa{
    margin-top:15px;
    width:90%;
    max-width:500px;
    padding:12px;
    font-size:18px;
    border:none;
    border-radius:6px;
}

#lista{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#222;
    border-radius:10px;
    margin-bottom:25px;
    overflow:hidden;
    box-shadow:0 0 15px rgba(0,0,0,.5);
}

.card img{
    width:100%;
    display:block;
    cursor:pointer;
}

.info{
    padding:18px;
}

.info h2{
    margin-top:0;
}

.info p{
    margin:8px 0;
}

#modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
}

#modal img{
    max-width:95%;
    max-height:95%;
}
</style>

</head>

<body>

<header>

<h1>CATÁLOGO DE PEÇAS MIURA</h1>

<input
type="text"
id="pesquisa"
placeholder="Pesquisar peça..."
>

</header>

<div id="lista"></div>

<div id="modal" onclick="fecharImagem()">

<img id="imagemGrande">

</div>

<script>

let pecas=[];

fetch("pecas.json")

.then(resposta=>resposta.json())

.then(dados=>{

pecas=dados;

mostrarPecas(pecas);

});

function mostrarPecas(lista){

const container=document.getElementById("lista");

container.innerHTML="";

lista.forEach(function(peca){

container.innerHTML+=`

<div class="card">

<img
src="imagens/${peca.imagem}"
onclick="abrirImagem(this.src)"
>

<div class="info">

<h2>${peca.nome}</h2>

<p><b>Código:</b> ${peca.codigo}</p>

<p><b>Aplicação:</b> ${peca.aplicacao}</p>

<p>${peca.descricao}</p>

</div>

</div>

`;

});

}

document.getElementById("pesquisa").addEventListener("keyup",function(){

let texto=this.value.toLowerCase();

let resultado=pecas.filter(function(p){

return (

p.nome.toLowerCase().includes(texto)

||

p.codigo.toLowerCase().includes(texto)

||

p.aplicacao.toLowerCase().includes(texto)

||

p.descricao.toLowerCase().includes(texto)

);

});

mostrarPecas(resultado);

});

function abrirImagem(src){

document.getElementById("imagemGrande").src=src;

document.getElementById("modal").style.display="flex";

}

function fecharImagem(){

document.getElementById("modal").style.display="none";

}

</script>

</body>

</html>
